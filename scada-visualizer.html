<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+Bengali:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="libs/leaflet.min.css" />
    <title>SCADA View</title>
    <script src="libs/fp.min.js"></script>
    <script src="common.js"></script>
    <script src="scada-core.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Nunito', 'Noto Sans Bengali', sans-serif;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .header {
            background: #212529;
            color: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .header h1 { font-size: 0.95rem; letter-spacing: 1px; text-transform: uppercase; flex-shrink: 0; }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 6px;
            color: white;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 4px 10px;
            text-decoration: none;
            letter-spacing: 0.3px;
            flex-shrink: 0;
            transition: background 0.2s, transform 0.1s;
        }
        .back-link:hover { background: rgba(255,255,255,0.22); }
        .back-link:active { transform: scale(0.96); }

        /* Zone selector button */
        #zone-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 12px;
            border-radius: 6px;
            border: 1px solid #495057;
            background: #343A40;
            color: white;
            font-size: 0.85rem;
            font-family: inherit;
            cursor: pointer;
            min-width: 220px;
            max-width: 320px;
            transition: border-color 0.15s, background 0.15s, transform 0.1s;
        }
        #zone-btn:hover { border-color: #F5821F; background: #3b4248; }
        #zone-btn:active { transform: scale(0.97); }
        #zone-btn-label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
        #zone-btn .zb-caret { flex-shrink: 0; opacity: 0.6; font-size: 0.7rem; }

        /* Zone selector modal */
        .zone-modal-overlay {
            position: fixed; inset: 0; z-index: 1000;
            display: none; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 20px;
        }
        .zone-modal-overlay.show { display: flex; }
        .zone-modal {
            width: 100%; max-width: 460px; max-height: 80vh;
            display: flex; flex-direction: column;
            background: #2b3035;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 14px;
            box-shadow: 0 18px 50px rgba(0,0,0,0.55);
            overflow: hidden;
            animation: zoneModalIn 0.18s ease-out;
        }
        @keyframes zoneModalIn { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: none; } }
        .zone-modal-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 18px;
            font-size: 0.95rem; font-weight: 700; letter-spacing: 0.3px;
            color: #fff;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .zone-modal-close {
            border: none; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.75);
            width: 28px; height: 28px; border-radius: 50%; font-size: 18px; line-height: 1;
            cursor: pointer; transition: background 0.12s, color 0.12s;
        }
        .zone-modal-close:hover { background: rgba(245,130,31,0.35); color: #fff; }
        .zone-list { overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
        .zone-item {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            width: 100%; text-align: left;
            padding: 12px 14px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 9px;
            background: rgba(255,255,255,0.03);
            color: #e9ecef; font-family: inherit; font-size: 0.85rem; font-weight: 600;
            cursor: pointer; transition: background 0.12s, border-color 0.12s;
        }
        .zone-item:hover { background: rgba(245,130,31,0.14); border-color: rgba(245,130,31,0.5); }
        .zone-item.active { background: rgba(245,130,31,0.2); border-color: #F5821F; }
        .zone-item .zi-check { color: #F5821F; font-weight: 800; flex-shrink: 0; }

        /* Sync indicator */
        #sync-status {
            margin-left: auto;
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 0.72rem; color: rgba(255,255,255,0.6);
            flex-shrink: 0;
            cursor: default;
        }
        #sync-dot {
            width: 9px; height: 9px; border-radius: 50%;
            background: #6c757d;
            flex-shrink: 0;
            transition: background 0.3s;
        }
        #sync-status.ok    #sync-dot { background: #27ae60; }
        #sync-status.error #sync-dot { background: #e74c3c; }
        #sync-status.busy  #sync-dot { background: #f0a020; animation: syncPulse 1s ease-in-out infinite; }
        @keyframes syncPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        #sync-status.error #sync-text { color: #f1948a; }
        #sync-text:empty { display: none; }

        /* Map container fills remaining space */
        #map-container {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            min-height: 0;
        }

        /* Map toggle button */
        #map-toggle-btn {
            position: absolute;
            top: 16px; right: 16px;
            width: 36px; height: 36px;
            border-radius: 8px;
            border: 2px solid rgba(127,219,202,0.5);
            background: rgba(33,37,41,0.82);
            color: #F5821F;
            font-size: 16px; cursor: pointer;
            z-index: 12;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.35);
            transition: background 0.15s, border-color 0.15s, opacity 0.15s, transform 0.1s;
        }
        #map-toggle-btn:hover { background: rgba(245,130,31,0.18); border-color: #F5821F; }
        #map-toggle-btn:active { transform: scale(0.92); }
        #map-toggle-btn.map-off { opacity: 0.5; }

        /* Locate button */
        #locate-btn {
            position: absolute;
            top: 16px; right: 60px;
            width: 36px; height: 36px;
            border-radius: 8px;
            border: 2px solid rgba(127,219,202,0.5);
            background: rgba(33,37,41,0.82);
            color: #F5821F;
            font-size: 16px; cursor: pointer;
            z-index: 12;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.35);
            transition: background 0.15s, border-color 0.15s, opacity 0.15s, transform 0.1s;
        }
        #locate-btn:hover { background: rgba(245,130,31,0.18); border-color: #F5821F; }
        #locate-btn:active { transform: scale(0.92); }
        #locate-btn.locating { opacity: 0.6; cursor: progress; }
        #locate-btn.active { background: rgba(245,130,31,0.25); border-color: #F5821F; }

        /* Search bar */
        #search-wrap { position:absolute; top:16px; left:16px; z-index:12; width:220px; }
        #search-input { width:100%; padding:8px 34px 8px 12px; border:2px solid rgba(127,219,202,0.5); border-radius:8px; background:rgba(33,37,41,0.82); color:#fff; font-size:13px; font-family:'Nunito','Noto Sans Bengali',sans-serif; font-weight:600; outline:none; box-shadow:0 2px 6px rgba(0,0,0,0.35); transition:border-color .15s; }
        #search-input::placeholder { color:rgba(255,255,255,0.45); font-weight:400; }
        #search-input:focus { border-color:#F5821F; }
        #search-clear { position:absolute; top:7px; right:7px; width:22px; height:22px; display:none; align-items:center; justify-content:center; border:none; border-radius:50%; background:rgba(255,255,255,0.12); color:rgba(255,255,255,0.7); font-size:15px; line-height:1; cursor:pointer; padding:0; transition:background .12s,color .12s; }
        #search-clear:hover { background:rgba(245,130,31,0.35); color:#fff; }
        #search-clear.show { display:flex; }
        #search-results { position:absolute; top:100%; left:0; right:0; margin-top:4px; border-radius:8px; background:rgba(33,37,41,0.92); border:1px solid rgba(255,255,255,0.12); overflow:hidden; display:none; box-shadow:0 4px 16px rgba(0,0,0,0.45); }
        .sr-item { padding:8px 12px; cursor:pointer; font-size:12px; font-weight:600; color:#ddd; border-bottom:1px solid rgba(255,255,255,0.06); transition:background .12s; }
        .sr-item:last-child { border-bottom:none; }
        .sr-item:hover { background:rgba(245,130,31,0.25); color:#fff; }
        .sr-item .sr-sub { font-size:10px; color:rgba(255,255,255,0.45); font-weight:400; margin-top:1px; }

        /* Leaflet attribution */
        .leaflet-control-attribution { font-size: 9px !important; }

        /* Loading overlay */
        #loading {
            position: absolute;
            inset: 0;
            background: rgba(26,26,26,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: #ecf0f1;
            z-index: 20;
        }
        #loading.hidden { display: none; }

        /* Legend */
        .legend {
            position: absolute;
            bottom: 20px;
            left: 12px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 10px;
            padding: 10px 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            font-size: 0.78rem;
            z-index: 15;
            max-width: calc(100vw - 100px);
            border: 1px solid rgba(0,0,0,0.06);
        }
        .legend-toggle {
            display: none;
            background: none; border: none; cursor: pointer;
            font-size: 0.75rem; font-weight: 800;
            color: #343A40; padding: 0; line-height: 1;
        }
        .legend h4 {
            margin-bottom: 8px; color: #212529; font-size: 0.83rem;
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
        }
        .legend-body { display: block; }
        .legend.collapsed .legend-body { display: none; }
        .legend-item { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
        .lg-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
        .lg-line { width: 26px; height: 4px; flex-shrink: 0; border-radius: 2px; }
        .lg-line-active { animation: lgFlowDash 1s linear infinite; background-size: 10px 4px; background-image: repeating-linear-gradient(90deg, #2ecc71 0, #2ecc71 10px, transparent 10px, transparent 20px); }
        @keyframes lgFlowDash { from { background-position: 0 0; } to { background-position: 20px 0; } }

        /* Feature info panel */
        #feature-info-panel {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(33,37,41,0.97);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #ecf0f1;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding: 10px 20px;
            z-index: 30;
            display: none;
            font-family: 'Nunito', 'Noto Sans Bengali', sans-serif;
            font-size: 0.82rem;
            box-shadow: 0 -4px 24px rgba(0,0,0,0.4);
        }
        #feature-info-panel.visible { display: flex; }
        .fip-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .fip-title {
            font-size: 0.88rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #F5821F;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .fip-close {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.6);
            border-radius: 4px;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 0.75rem;
            flex-shrink: 0;
        }
        .fip-close:hover { background: rgba(255,255,255,0.1); color: white; }
        .fip-fields {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 20px;
        }
        .fip-field {
            display: flex;
            flex-direction: column;
            min-width: 80px;
        }
        .fip-key {
            font-size: 0.68rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 1px;
        }
        .fip-val {
            font-size: 0.82rem;
            color: #ecf0f1;
            word-break: break-word;
        }
        .fip-val.empty { color: rgba(255,255,255,0.25); font-style: italic; }
        .fip-val.state-on  { color: #2ecc71; font-weight: 700; }
        .fip-val.state-off { color: #e74c3c; font-weight: 700; }
        .fip-desc-block {
            flex: 1;
            min-width: 200px;
        }
        .fip-desc-block .fip-val {
            background: rgba(241,196,15,0.1);
            border-left: 3px solid #f1c40f;
            padding: 4px 8px;
            border-radius: 0 4px 4px 0;
            color: #f9e79f;
            line-height: 1.4;
        }
        .fip-inner { flex: 1; }

        /* Mobile breakpoint */
        @media (max-width: 480px) {
            .header { padding: 8px 10px; gap: 8px; }
            .header h1 { font-size: 0.78rem; }
            .back-link { padding: 4px 8px; }
            #zone-btn { flex: 1 1 130px; min-width: 0; max-width: none; width: auto; font-size: 0.8rem; }
            #sync-status { font-size: 0.66rem; }
            #sync-status #sync-text { display: none; }
            #locate-btn     { top: 10px; right: 10px; }
            #map-toggle-btn { top: 54px; right: 10px; }
            #locate-btn, #map-toggle-btn { width: 38px; height: 38px; }
            .legend { bottom: 16px; left: 8px; padding: 8px 10px; max-width: calc(100vw - 90px); font-size: 0.72rem; }
            .legend-toggle { display: inline; }
            #feature-info-panel { max-height: 50vh; overflow-y: auto; padding: 10px 14px; }
            .fip-fields { gap: 5px 12px; }
            .fip-desc-block { min-width: 0; width: 100%; }
            .fip-close { padding: 6px 12px; font-size: 0.82rem; }
        }
        @media (min-width: 481px) and (max-width: 767px) {
            .header { padding: 8px 14px; gap: 10px; }
            #zone-btn { min-width: 160px; font-size: 0.82rem; }
            .legend { bottom: 16px; left: 10px; font-size: 0.75rem; padding: 9px 12px; }
            .legend-toggle { display: inline; }
        }
    </style>
</head>
<body>

<div class="header">
    <a href="index.html" class="back-link"><span aria-hidden="true">&larr;</span> <span class="bl-label">Asset Control</span></a>
    <h1>&#x1F30A; SCADA View</h1>
    <button id="zone-btn" type="button" onclick="openZoneModal()" title="Change zone">
        <span id="zone-btn-label">Loading zones&hellip;</span>
        <span class="zb-caret" aria-hidden="true">&#x25BE;</span>
    </button>
    <div id="sync-status" class="busy" title="Initializing&hellip;">
        <span id="sync-dot"></span>
        <span id="sync-text"></span>
    </div>
</div>

<!-- Zone selector modal -->
<div id="zone-modal" class="zone-modal-overlay" onclick="if(event.target===this)closeZoneModal()">
    <div class="zone-modal" role="dialog" aria-modal="true" aria-label="Select a zone">
        <div class="zone-modal-head">
            <span>Select a zone</span>
            <button class="zone-modal-close" type="button" onclick="closeZoneModal()" aria-label="Close">&times;</button>
        </div>
        <div id="zone-list" class="zone-list"></div>
    </div>
</div>

<div id="map-container">
    <div id="loading">Loading zone&hellip;</div>

    <button id="locate-btn" title="Show my location" onclick="locateMe()">&#x1F4CD;</button>
    <button id="map-toggle-btn" title="Toggle satellite map" onclick="toggleMap()">&#x1F5FA;&#xFE0F;</button>

    <div id="search-wrap">
      <input type="text" id="search-input" placeholder="Search feature&hellip;" autocomplete="off" oninput="filterFeatures()" onblur="setTimeout(()=>{document.getElementById('search-results').style.display='none'},200)" onfocus="filterFeatures()">
      <button id="search-clear" type="button" title="Clear search" aria-label="Clear search" onmousedown="event.preventDefault()" onclick="clearSearch()">&times;</button>
      <div id="search-results"></div>
    </div>

    <div class="legend" id="legend">
        <h4>Legend <button class="legend-toggle" onclick="toggleLegend()" id="legend-toggle-btn" aria-label="Toggle legend">&#x25BE;</button></h4>
        <div class="legend-body">
        <div class="legend-item"><div class="lg-dot" style="background:#2ecc71; border: 2px solid #27ae60;"></div>Valve OPEN</div>
        <div class="legend-item"><div class="lg-dot" style="background:#e74c3c; border: 2px solid #c0392b;"></div>Valve CLOSED</div>
        <div class="legend-item"><div class="lg-dot" style="background:#8e44ad; border: 3px solid #2ecc71;"></div>Pump RUNNING</div>
        <div class="legend-item"><div class="lg-dot" style="background:#95a5a6; border: 2px solid #7f8c8d;"></div>Pump STOPPED</div>
        <div class="legend-item"><div class="lg-dot" style="background:#3498db; border: 2px solid #2980b9;"></div>Zone ACTIVE</div>
        <div class="legend-item"><div class="lg-dot" style="background:#bdc3c7; border: 2px solid #95a5a6;"></div>Zone INACTIVE</div>
        <div class="legend-item"><div class="lg-line lg-line-active"></div>Active Flow</div>
        <div class="legend-item"><div class="lg-line" style="background:#e74c3c;"></div>Leak/Burst</div>
        </div>
    </div>

    <!-- Feature info panel -->
    <div id="feature-info-panel" role="complementary" aria-label="Feature information">
        <div class="fip-inner">
            <div class="fip-header">
                <span class="fip-title" id="fip-title">Feature Info</span>
                <button class="fip-close" onclick="closeFeaturePanel()" aria-label="Close info panel">&times; Close</button>
            </div>
            <div class="fip-fields" id="fip-fields"></div>
        </div>
    </div>
</div>

<script src="libs/leaflet.min.js"></script>
<script src="libs/leaflet-kml.js"></script>
<script>
    // ── LEGEND ────────────────────────────────────────────────────────────────
    function toggleLegend() {
        const leg = document.getElementById('legend');
        const btn = document.getElementById('legend-toggle-btn');
        const collapsed = leg.classList.toggle('collapsed');
        btn.textContent = collapsed ? '\u25B8' : '\u25BE';
        btn.setAttribute('aria-expanded', String(!collapsed));
    }
    if (window.innerWidth <= 767) {
        const leg = document.getElementById('legend');
        const btn = document.getElementById('legend-toggle-btn');
        if (leg && btn) { leg.classList.add('collapsed'); btn.textContent = '\u25B8'; }
    }

    // ── CONFIG ────────────────────────────────────────────────────────────────
    const REFRESH_INTERVAL_MS = 20000;

    // ── STATE ──────────────────────────────────────────────────────────────────
    let deviceId        = '';
    let leakBurstState  = {};
    let refreshTimer    = null;
    let currentZone     = null;
    let selectedFeatureId = null;

    // Leaflet map
    let map             = null;
    let mapVisible      = true;

    // KML layer for the current zone
    let kmlLayer        = null;
    let kmlFeatures     = [];   // flat array of all features for search

    // ── LEAFLET MAP ────────────────────────────────────────────────────────────
    function initializeMap() {
        if (map) return;
        map = L.map('map-container', {
            zoomControl: false,
            attributionControl: true,
            zoomSnap: 0
        }).setView([24.19, 88.30], 11);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 19
        }).addTo(map);
    }

    function toggleMap() {
        mapVisible = !mapVisible;
        const container = document.getElementById('map-container');
        const btn = document.getElementById('map-toggle-btn');
        // Map tile layer is always present; just zoom to fit KML bounds when toggling on
        btn.classList.toggle('map-off', !mapVisible);
        if (mapVisible && kmlLayer) {
            fitMapToKml();
        }
    }

    function fitMapToKml() {
        if (!map || !kmlLayer) return;
        const bounds = kmlLayer.getBounds();
        if (bounds.isValid()) {
            map.fitBounds(bounds, { padding: [60, 60] });
        }
    }

    // ── LOCATE ME ──────────────────────────────────────────────────────────────
    let _userLocMarker = null;
    let _userLocCircle = null;
    function locateMe() {
        const btn = document.getElementById('locate-btn');
        if (!navigator.geolocation) {
            alert('Location is not supported on this device/browser.');
            return;
        }
        if (!map) initializeMap();

        btn.classList.add('locating');
        navigator.geolocation.getCurrentPosition(
            pos => {
                btn.classList.remove('locating');
                btn.classList.add('active');
                const latlng = [pos.coords.latitude, pos.coords.longitude];
                const acc = pos.coords.accuracy || 0;

                if (_userLocMarker) {
                    _userLocMarker.setLatLng(latlng);
                    _userLocCircle.setLatLng(latlng).setRadius(acc);
                } else {
                    _userLocCircle = L.circle(latlng, {
                        radius: acc,
                        color: '#F5821F', weight: 1,
                        fillColor: '#F5821F', fillOpacity: 0.12
                    }).addTo(map);
                    _userLocMarker = L.circleMarker(latlng, {
                        radius: 7,
                        color: '#fff', weight: 2,
                        fillColor: '#F5821F', fillOpacity: 1
                    }).addTo(map);
                    _userLocMarker.bindTooltip('You are here', { direction: 'top' });
                }
                map.setView(latlng, Math.max(map.getZoom(), 16));
            },
            err => {
                btn.classList.remove('locating');
                const msg = err.code === err.PERMISSION_DENIED
                    ? 'Location permission denied. Please allow location access.'
                    : 'Unable to get your location. Make sure GPS is on and try again.';
                alert(msg);
            },
            { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
        );
    }

    // ── ZONE SELECTOR ──────────────────────────────────────────────────────────
    let zonesList = [];

    function openZoneModal()  { document.getElementById('zone-modal').classList.add('show'); }
    function closeZoneModal() { document.getElementById('zone-modal').classList.remove('show'); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeZoneModal(); });

    function renderZoneList(activeId) {
        const list = document.getElementById('zone-list');
        list.innerHTML = zonesList.map(z =>
            '<button type="button" class="zone-item' + (z.id === activeId ? ' active' : '') + '" onclick="selectZone(\'' + esc(z.id) + '\')">' +
               '<span class="zi-name">' + esc(z.name) + '</span>' +
               (z.id === activeId ? '<span class="zi-check" aria-hidden="true">\u2713</span>' : '') +
             '</button>').join('');
    }

    function selectZone(id) {
        const zone = zonesList.find(z => z.id === id);
        if (!zone) return;
        closeZoneModal();
        document.getElementById('zone-btn-label').textContent = zone.name;
        renderZoneList(id);
        currentZone = null;
        loadZone(zone);
    }

    async function loadManifest() {
        try {
            const res = await fetch('manifest.json?t=' + Date.now());
            if (!res.ok) throw new Error('manifest.json not found');
            zonesList = await res.json();

            if (zonesList.length > 0) {
                const savedId    = localStorage.getItem('scada_last_zone');
                const zoneToLoad = (savedId && zonesList.find(z => z.id === savedId)) || zonesList[0];
                document.getElementById('zone-btn-label').textContent = zoneToLoad.name;
                renderZoneList(zoneToLoad.id);
                loadZone(zoneToLoad);
            } else {
                document.getElementById('zone-btn-label').textContent = 'No zones';
            }
        } catch (err) {
            document.getElementById('zone-btn-label').textContent = 'Error loading zones';
            console.error(err);
        }
    }

    // ── LOAD ZONE KML ──────────────────────────────────────────────────────────
    async function loadZone(zone) {
        if (currentZone && currentZone.id === zone.id) return;
        currentZone = zone;
        localStorage.setItem('scada_last_zone', zone.id);

        if (refreshTimer) clearInterval(refreshTimer);

        // Reset search
        selectedFeatureId = null;
        const _si = document.getElementById('search-input');
        if (_si) _si.value = '';
        const _sr = document.getElementById('search-results');
        if (_sr) _sr.style.display = 'none';
        const _sc = document.getElementById('search-clear');
        if (_sc) _sc.classList.remove('show');

        showLoading(true);
        setStatus('Loading ' + zone.name + '\u2026', 'busy');

        try {
            if (!map) initializeMap();

            // Remove previous KML layer
            if (kmlLayer) {
                map.removeLayer(kmlLayer);
                kmlLayer = null;
                kmlFeatures = [];
            }

            const kmlFile = zone.kmlFile || (zone.id + '.kml');
            const kmlUrl  = 'zones/' + kmlFile + '?t=' + Date.now();

            // Fetch and parse KML
            kmlLayer = await L.kmlFetch(kmlUrl);

            // Collect all features for search
            kmlFeatures = [];
            kmlLayer.eachLayer(function(layer) {
                if (layer.feature) kmlFeatures.push(layer.feature);
            });

            // Listen for feature clicks
            kmlLayer.on('featureclick', function(e) {
                showFeaturePanel(e.feature);
            });

            // Add to map and fit bounds
            kmlLayer.addTo(map);
            fitMapToKml();

            showLoading(false);

            // Start live refresh
            await refreshStatus(zone);
            refreshTimer = setInterval(() => refreshStatus(zone), REFRESH_INTERVAL_MS);

        } catch (err) {
            showLoading(false);
            setStatus('\u26A0 ' + err.message, 'error');
            console.error(err);
        }
    }

    // ── FETCH LIVE STATUS ──────────────────────────────────────────────────────
    async function refreshStatus(zone) {
        if (!kmlLayer || !zone) return;
        setStatus('Syncing\u2026', 'busy');
        try {
            const files = await workerGet('status');
            const raw   = files[zone.gistFile] || '[]';
            const data  = JSON.parse(raw);

            const updated = applyStatus(kmlLayer, data);

            // Propagate flow from pump/valve states
            propagateFlow(kmlLayer);

            setStatus('Synced ' + new Date().toLocaleTimeString() + ' (' + updated + ' elements)', 'ok');
        } catch (err) {
            setStatus('\u26A0 ' + err.message, 'error');
            console.error('Refresh error:', err);
        }
    }

    // ── FEATURE SEARCH ─────────────────────────────────────────────────────────
    function filterFeatures() {
        const el  = document.getElementById('search-input');
        const res = document.getElementById('search-results');
        const clr = document.getElementById('search-clear');
        const q   = (el.value || '').trim().toLowerCase();
        if (clr) clr.classList.toggle('show', !!(el.value || '').length);
        if (!q || !kmlLayer) {
            res.style.display = 'none';
            if (!q) clearSearchSelection();
            return;
        }

        const matches = kmlFeatures.filter(f => {
            const name = (f.name || '').toLowerCase();
            const id   = (f.id || '').toLowerCase();
            return name.includes(q) || id.includes(q);
        });

        if (!matches.length) {
            res.style.display = 'block';
            res.innerHTML = '<div class="sr-item" style="color:rgba(255,255,255,0.4)">No matching features</div>';
            return;
        }

        res.style.display = 'block';
        res.innerHTML = matches.slice(0, 20).map(f => {
            const name = esc(f.name || f.id || '');
            const id   = esc(f.id || '');
            const type = f.type === 'line' ? 'Pipe' : 'Point';
            return '<div class="sr-item" onclick="zoomToFeature(\'' + esc(f.id) + '\')">'
              + name
              + '<div class="sr-sub">' + id + ' (' + type + ')</div></div>';
        }).join('');
    }

    function clearSearchSelection() {
        selectedFeatureId = null;
        if (kmlLayer) {
            kmlLayer.eachLayer(function(layer) {
                if (layer.feature && layer.feature._highlighted) {
                    layer.setStyle({ weight: layer.feature._origWeight || 4 });
                    layer.feature._highlighted = false;
                }
            });
        }
    }

    function clearSearch() {
        const el  = document.getElementById('search-input');
        const res = document.getElementById('search-results');
        const clr = document.getElementById('search-clear');
        if (el)  el.value = '';
        if (res) res.style.display = 'none';
        if (clr) clr.classList.remove('show');
        clearSearchSelection();
        if (el) el.focus();
    }

    function zoomToFeature(featureId) {
        if (!map || !kmlLayer) return;
        let target = null;
        kmlLayer.eachLayer(function(layer) {
            if (layer.feature && layer.feature.id === featureId) target = layer;
        });
        if (!target) return;

        // Fit map to the feature
        if (target instanceof L.Polyline) {
            map.fitBounds(target.getBounds(), { padding: [80, 80], maxZoom: 19 });
        } else {
            map.setView(target.getLatLng ? target.getLatLng() : target.getCenter(), Math.max(map.getZoom(), 16));
        }

        // Highlight
        clearSearchSelection();
        if (target.setStyle && target.feature) {
            target.feature._origWeight = target.feature._origWeight || (target.options && target.options.weight) || 4;
            target.setStyle({ weight: 8, opacity: 1 });
            target.feature._highlighted = true;
        }
        selectedFeatureId = featureId;

        document.getElementById('search-results').style.display = 'none';
        document.getElementById('search-input').blur();
    }

    // ── FEATURE INFO PANEL ─────────────────────────────────────────────────────
    function showFeaturePanel(feat) {
        if (!feat) return;
        const panel = document.getElementById('feature-info-panel');
        const title = document.getElementById('fip-title');
        const fields = document.getElementById('fip-fields');

        title.textContent = feat.name || feat.id || 'Feature Info';

        const st   = feat.status || {};
        const props = feat.properties || {};
        const nodeType = st.type || props.type || '';
        const state    = st.state || '';
        const flow     = st.flow || props.flow || '';
        const comment  = st.comment || '';
        const desc     = feat.description || '';

        function field(key, val, extraClass) {
            const isEmpty = val === '' || val == null;
            return '<div class="fip-field">' +
                '<span class="fip-key">' + key + '</span>' +
                '<span class="fip-val' + (isEmpty ? ' empty' : '') + (extraClass ? ' ' + extraClass : '') + '">' + (isEmpty ? '\u2014' : val) + '</span>' +
            '</div>';
        }

        let html = field('ID', feat.id)
                 + field('Type', nodeType ? nodeType.charAt(0).toUpperCase() + nodeType.slice(1) : (feat.type === 'line' ? 'Pipe' : ''))
                 + field('Label', feat.name)
                 + field('State', state, state === 'ON' ? 'state-on' : state === 'OFF' ? 'state-off' : '');

        if (flow) {
            const flowLabel = flow === 'active' ? '\u25B6 Active' : flow === 'leakburst' ? '\u26A0 LEAK/BURST' : flow;
            const flowCls   = flow === 'active' ? 'state-on' : flow === 'leakburst' ? 'state-off' : '';
            html += field('Flow', flowLabel, flowCls);
        }

        if (props.source && props.target) {
            html += field('From', props.source);
            html += field('To', props.target);
        }

        if (comment) {
            html += '<div class="fip-field fip-desc-block">' +
                '<span class="fip-key">Comment</span>' +
                '<span class="fip-val">' + esc(comment) + '</span>' +
            '</div>';
        }

        if (desc) {
            html += '<div class="fip-field fip-desc-block">' +
                '<span class="fip-key">Description</span>' +
                '<span class="fip-val">' + esc(desc) + '</span>' +
            '</div>';
        }

        fields.innerHTML = html;
        panel.classList.add('visible');
    }

    function closeFeaturePanel() {
        document.getElementById('feature-info-panel').classList.remove('visible');
    }

    // Tap on background closes the panel
    document.addEventListener('click', function(e) {
        if (!e.target.closest('#feature-info-panel') && !e.target.closest('.sr-item')) {
            closeFeaturePanel();
        }
    });

    // ── UI HELPERS ─────────────────────────────────────────────────────────────
    function setStatus(msg, state) {
        const el = document.getElementById('sync-status');
        if (!el) return;
        el.classList.remove('busy', 'ok', 'error');
        el.classList.add(state);
        el.title = msg;
        const txt = document.getElementById('sync-text');
        if (txt) txt.textContent = (state === 'error') ? msg : '';
    }

    function showLoading(visible) {
        document.getElementById('loading').classList.toggle('hidden', !visible);
    }

    // ── BOOT ───────────────────────────────────────────────────────────────────
    (async () => {
        initializeMap();
        deviceId = await getDeviceId();
        loadManifest();
    })();
</script>
